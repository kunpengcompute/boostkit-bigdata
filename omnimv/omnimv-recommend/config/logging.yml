version: 1
formatters:
  omnimv:
    format: '[OmniMV] %(asctime)s - %(filename)s:%(lineno)s - %(levelname)s - %(message)s'
handlers:
  console:
    class : logging.StreamHandler
    formatter: omnimv
    level   : INFO
    stream  : ext://sys.stdout
  file:
    class : logging.handlers.RotatingFileHandler
    formatter: omnimv
    filename: omnimv.log
    maxBytes: 10485760
    backupCount: 5
loggers:
  omnimv:
    level: INFO
    handlers: [console, file]
    propagate: no
root:
  level: ERROR
  handlers: [console]