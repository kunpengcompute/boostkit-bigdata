[schema]
# schema sql路径
schema_path = hdfs://hdfs-server1:9000/omnimv-343/schema.sql
table_bytes_path = hdfs://hdfs-server1:9000/omnimv-343/table_bytes
[spark]
# 数据库名称
database = tpcds_bin_partitioned_varchar_orc_10
# mock数据库名称
mock_database = mock
# mock数据库使用前是否清空所有表
mock_database_truncate_enable = false
# spark yarn模式下，指定query执行的时间段
q_log_start_time = 2024-10-12 17:41
q_log_end_time = 2024-10-12 18:57
# 日志解析的jar包路径
logparser_jar_path = /opt/omnimv-343/boostkit-omnimv-logparser-spark-3.4.3-1.1.0-aarch64.jar
# omnimv plugin的路径
cache_plugin_jar_path = /opt/omnimv-343/boostkit-omnimv-spark-3.4.3-1.1.0-aarch64.jar
# spark-defaults.conf路径下面配置的spark history输出的路径
hdfs_input_path = hdfs://hdfs-server1:9000/spark2-history
# 通过日志解析之后，把每条日志解析成json格式，所有日志存放的路径
hdfs_output_path = hdfs://hdfs-server1:9000/omnimv-343/spark2-history-json
# sql语句的存放路径，这里以tpcds sql为例
sqls_path = hdfs://hdfs-server1:9000/omnimv-343/tpcds
# 表大小的阈值，超过设置的阈值，则认为该表是一张大表，默认阈值为1G，即1000000000
large_table_threshold = 1000000000
# 候选视图的阈值，只选取前面TOP的候选视图
mv_limit = 10
[result]
# 候选视图存放的路径，同时会在改目录下面生成子目录：mv_sql(所有候选视图)，top_mv（top N 候选视图）
mv_output_path = hdfs://hdfs-server1:9000/omnimv-343/mv
[yarn]
# spark执行的模式，yarn模式还是local模式
spark_master = local
# spark参数中--name后面的参数
app_name = omnimv
# spark参数中--num-executors指定的参数
spark_num_executors = 30
# spark参数中--executor-memory指定的参数
spark_executor_memory = 32g
# spark参数中--driver-memory指定的参数
spark_driver_memory = 48g
# spark参数中--executor-cores指定的参数
executor_cores = 18
# 执行spark-sql session的超时时间，默认单位是s，这里默认指定5000s超时时间
session_timeout = 5000