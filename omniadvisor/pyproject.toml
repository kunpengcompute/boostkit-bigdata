# 构建工具
[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "omniadvisor"
version = "0.1.0"
description = "A sample Python project using Poetry"
authors = ["hw"]
packages = [
    { include = "server", from = "src" },
    { include = "omniadvisor", from = "src" }
]

[tool.poetry.dependencies]
# 正式版本依赖
python = "~3.9.9"
django = "~4.2.10"
smac = "~2.2.0"
colorlog = "~6.9.0"
requests = "^2.32.3"
python-dateutil = "2.9.0.post0"
psycopg2-binary = "^2.9.10"
django-sslserver = "0.22"
keyring = "24.3.1"
keyrings-alt = "5.0.2"

[tool.poetry.group.test.dependencies]
pytest = "^7.4.4"
pytest-xdist = "^3.6.1"
Cython = "^3.0.10"

[tool.pytest.ini_options]
testpaths = ["tests/"]       # 指定 pytest 搜索测试的路径
pythonpath = ["src"]           # ⚡ 自动添加 src 到 PYTHONPATH
addopts = "--import-mode=append" # 避免导入冲突


[[tool.poetry.source]]
name = "huawei"
url = "http://mirrors.tools.huawei.com/pypi/simple"
priority = "primary"
