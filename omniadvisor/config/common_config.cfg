[common]
# 调优复测次数
tuning.retest.times=3
# 评估配置失效的阈值，当配置执行失败次数大于等于此值，则配置失效
config.fail.threshold = 1
#调优策略
tuning.strategy=[["transfer", 1],["expert", 2],["iterative", 10]]

[spark]
# Spark History Server的URL 仅用于Rest模式
spark.history.rest.url=http://localhost:18080
# Spark从History Sever抓取Trace的超时时间
spark.fetch.trace.timeout=10
# Spark从History Sever抓取Trace的间隔用时
spark.fetch.trace.interval=2
# Spark任务执行的超时时间，对比基线的比例
spark.exec.timeout.ratio=10.0