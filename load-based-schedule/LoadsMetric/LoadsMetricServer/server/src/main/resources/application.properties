server.port=9090

time.windowsize=5

# logical resource usage levels, 10 represent level from 0 to 9
logical-resource-usage.levels.mem=10
logical-resource-usage.levels.vcores=10

# limits for multi resource usage
load.limit.cpu=50
load.limit.mem=50
load.limit.diskio=50
load.limit.netio=50

# weights for multi resource usage
load.weight.cpu=0.2
load.weight.mem=0.2
load.weight.diskio=0.3
load.weight.netio=0.3

expiration.time=60

client.heartbeat.interval=1000
#node exporter params
net.compute.type=max
node-exporter.pull.enable=true
node-exporter.pull.protocol=http
node-exporter.pull.port=9100
node-exporter.pull.thread-pool.size=1000

overload.filter.able=true

client.lost.time=2000